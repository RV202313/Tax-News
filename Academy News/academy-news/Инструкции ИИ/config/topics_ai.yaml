# Темы, ключевые слова и приоритеты для поиска новостей ИИ в юридической работе
# config/topics_ai.yaml

topics:

  - id: ai_legislation
    label: Регулирование ИИ
    priority: P0
    keywords_ru:
      - "закон об ИИ"
      - "регулирование искусственного интеллекта"
      - "правовое регулирование ИИ"
      - "цифровой кодекс"
      - "ФЗ об ИИ"
    keywords_en:
      - "AI regulation"
      - "AI Act"
      - "AI law"
      - "AI governance legislation"
    regions: [russia, kazakhstan, europe_eu]

  - id: ai_court_cases
    label: ИИ в судах и прецеденты
    priority: P0
    keywords_ru:
      - "ИИ галлюцинации суд"
      - "ИИ доказательства суд"
      - "искусственный интеллект судопроизводство"
      - "нейросеть суд санкции"
