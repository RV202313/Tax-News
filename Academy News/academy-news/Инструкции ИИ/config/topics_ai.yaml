# ============================
# Глобальные ограничения
# ============================
global_limits:
  max_per_release: 12              # Максимум постов на выпуск
  required_per_region: 3           # Ровно 3 на каждый из 4 регионов
  max_days_old: 7                  # Новости не старше 7 дней
  max_generic_trend: 1             # Не более 1 общего тренда без конкретики

required_regions:
  - russia
  - kazakhstan
  - usa
  - europe  # europe_eu или europe_de или europe_gb

excluded_regions:
  - ukraine
