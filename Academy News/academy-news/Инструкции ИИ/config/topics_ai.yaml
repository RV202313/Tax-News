    keywords_en:
      - "AI hallucinations court"
      - "AI sanctions lawyer"
      - "fake citations AI court"
      - "AI evidence admissibility"
      - "AI court rules"
    regions: [usa, russia, europe_eu]

  - id: ai_contract_review
    label: ИИ анализ договоров
    priority: P0
    keywords_ru:
      - "ИИ анализ договоров"
      - "автоматизация проверки контрактов"
      - "нейросеть due diligence"
    keywords_en:
      - "AI contract review"
      - "AI due diligence law firm"
      - "contract automation legal"
