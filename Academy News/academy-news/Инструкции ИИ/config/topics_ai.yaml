  - id: ai_inhouse_legal
    label: ИИ в корпоративных юридических департаментах
    priority: P1
    keywords_ru:
      - "ИИ юридический департамент"
      - "корпоративный юрист ИИ"
      - "inhouse ИИ автоматизация"
    keywords_en:
      - "AI in-house legal department"
      - "corporate legal AI tools"
      - "GC AI deployment results"
    regions: [usa, europe_eu]

  - id: ai_kazakhstan_legal
    label: ИИ в юридической работе Казахстана
    priority: P0
    keywords_ru:
