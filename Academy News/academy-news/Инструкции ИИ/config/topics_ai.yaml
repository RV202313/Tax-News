      - "LegalTech кейс юрфирма"
      - "автоматизация юридической работы"
    keywords_en:
      - "law firm AI adoption case study"
      - "AI legal workflow implementation"
      - "legaltech ROI law firm"
      - "AI lawyer productivity results"
