monitored_chats:
  # === DAILY: ACADEMY BEPS ===
  - chat: "@AkademiaBEPS"
    purpose: "academy_beps_summary"
    mode: "daily_summary"
    summary_time: "20:00"
    summary_prompt: >
      Ниже — сообщения за сегодня из чата Академия BEPS.
      Составь структурированное резюме на русском языке:
      1. Основные налоговые и юридические вопросы, которые обсуждались.
      2. Запросы участников на помощь, рекомендации, контакты или консультации.
      3. Полезные ответы, ссылки, документы и практические выводы.
      4. Важные кейсы, юрисдикции и темы международного налогообложения.
      Для конкретных сообщений указывай автора и [MSG#N].
      Игнорируй приветствия, поздравления, флуд и нерелевантные сообщения.
      Формат: кратко, по делу, с группировкой по темам.

  # === HOURLY SUMMARY ===
  - chat: "@docsllm"
    purpose: "ai_tools_for_lawyers"
    mode: "hourly_summary"
    summary_prompt: >
      Ниже — сообщения за последний час из чата про ИИ для юристов.
      Составь краткое резюме на русском языке:
      1. Какие практически полезные AI-инструменты или сервисы упоминались?
      2. Какие кейсы применения ИИ в юридической практике обсуждались?
      3. Что заслуживает внимания юриста?
      Игнорируй общие новости, теорию и нерелевантные сообщения.
      Формат: структурированный обзор с пунктами, кратко и по делу.

  # === DAILY: ЗАДАЧИ ===
  - chat_invite: "https://t.me/+qTjSXlIISa4yNzY0"
    purpose: "tasks_daily_report"
    mode: "daily_summary"
    summary_time: "19:00"
    summary_prompt: >
      Ниже — сообщения за сегодня из рабочего чата.
      Составь детальный отчёт на русском языке:
      1. Какие задания были даны (кем и кому, если указано)?
      2. Какие задания были выполнены?
      3. Сравнение: что было запланировано vs что сделано.
      4. Что осталось невыполненным?
      Формат: структурированный отчёт-сравнение по итогам дня.

  # =============================================
  # === ГРУППА: AI / НЕЙРОСЕТИ ===
  # ИИ & Инфобиз + Делай RAG — объединённый дайджест 20:30 МСК
  # (docsllm отдельно — hourly выше)
  # =============================================
  - chat_invite: "https://t.me/+XNKVExNHWqxiYjc0"
    purpose: "ai_hourly_digest"
    mode: "hourly_summary"
    summary_prompt: >
      Ты — аналитик AI-каналов для профессионалов. Ниже — сообщения
      за день из нескольких чатов и каналов про искусственный интеллект.

      Составь дайджест ПОЛЕЗНЫХ РЕШЕНИЙ на русском языке:

      Для каждого полезного решения или инструмента укажи:
      - Название инструмента / подхода / технологии
      - Что он делает и для кого полезен
      - Кто предложил (автор сообщения) [MSG#N]
      - Практическая применимость (можно ли использовать прямо сейчас?)

      Группируй по категориям:
      1. ГОТОВЫЕ ИНСТРУМЕНТЫ И СЕРВИСЫ (можно использовать сразу)
      2. ПРОМПТЫ И МЕТОДИКИ (подходы, которые можно повторить)
      3. ИНТЕРЕСНЫЕ КЕЙСЫ (примеры реального применения)

      Игнорируй: общие новости без практической ценности, флуд, рекламу.
      Формат: структурированный обзор, кратко и по делу.

  - chat: "@delay_RAG"
    purpose: "ai_daily_digest"
    mode: "daily_summary"
    summary_time: "20:30"

  # =============================================
  # === ГРУППА: НИДЕРЛАНДЫ ===
  # NL Startups + Skilltostart — объединённый дайджест 21:00 МСК
  # =============================================
  - chat: "@NLStartupVisa"
    purpose: "nl_digest"
    mode: "daily_summary"
    summary_time: "21:00"
    summary_prompt: >
      Ты — аналитик Telegram-чатов про Нидерланды, стартапы и релокацию.
      Ниже — сообщения за день из нескольких чатов.

      Составь структурированный дайджест на русском языке:

      1. ЗАПРОСЫ И ПОТРЕБНОСТИ
      Кто и что ищет? (специалисты, партнёры, услуги, информация)
      Для каждого запроса укажи автора и [MSG#N].
      Это важно для понимания спроса в сообществе.

      2. МЕРОПРИЯТИЯ И АНОНСЫ
      Предстоящие события, митапы, вебинары, дедлайны.
      Даты, формат (онлайн/офлайн), ссылки на регистрацию если есть.

      3. ПОЛЕЗНАЯ ИНФОРМАЦИЯ
      - Изменения в визовых программах, законодательстве
      - Практические советы по регистрации бизнеса, налогам, ВНЖ
      - Опыт участников (кейсы: что сработало, что нет)

      4. КЛЮЧЕВЫЕ ОБСУЖДЕНИЯ
      О чём спорили или активно обсуждали?
      Краткое резюме позиций.

      Для каждого пункта указывай: источник (чат), автора, [MSG#N].
      Игнорируй флуд и нерелевантные сообщения.

  - chat: "@skilltostart"
    purpose: "nl_digest"
    mode: "daily_summary"
    summary_time: "21:00"

  # =============================================
  # === ГРУППА: ЮФМ (Юридический Форум) ===
  # 5 чатов — объединённый дайджест 20:45 МСК
  # =============================================
  - chat_title: "ЮФМ 2024. Посетители форума"
    purpose: "ufm_digest"
    mode: "daily_summary"
    summary_time: "20:45"
    summary_prompt: >
      Ты — аналитик юридического профессионального сообщества (ЮФМ).
      Ниже — сообщения за день из нескольких чатов Юридического Форума.

      Составь структурированный дайджест на русском языке:

      1. ЗАПРОСЫ НА СТРУКТУРИРОВАНИЕ
      Кто ищет помощь со структурированием бизнеса, холдингов,
      сделок M&A? Какие задачи описаны? Укажи автора и [MSG#N].

      2. МЕЖДУНАРОДНОЕ НАЛОГООБЛОЖЕНИЕ
      Вопросы и обсуждения по СИДН, КИК, трансфертному ценообразованию,
      валютному регулированию, налоговому резидентству.
      Какие юрисдикции упоминались?

      3. АНОНСЫ МЕРОПРИЯТИЙ
      Предстоящие конференции, вебинары, семинары, мастер-классы.
      Даты, спикеры, темы, ссылки на регистрацию.

      4. ПОЛЕЗНЫЕ КОНТАКТЫ И РЕКОМЕНДАЦИИ
      Кого рекомендовали как эксперта? Какие фирмы/сервисы упоминались?

      5. КЛЮЧЕВЫЕ ДИСКУССИИ
      О чём спорили? Какие позиции высказывались?

      Для каждого пункта указывай: чат-источник, автора, [MSG#N].
      Игнорируй приветствия, флуд и нерелевантные сообщения.

  - chat_title: "ЮФМ. Клуб"
    purpose: "ufm_digest"
    mode: "daily_summary"
    summary_time: "20:45"

  - chat_title: "ЮФМ. Клуб мастеров"
    purpose: "ufm_digest"
    mode: "daily_summary"
    summary_time: "20:45"

  - chat_title: "ЮФМ. Слушатели марафонов"
    purpose: "ufm_digest"
    mode: "daily_summary"
    summary_time: "20:45"

  - chat_title: "Налоговый Клуб ЮФМ"
    purpose: "ufm_digest"
    mode: "daily_summary"
    summary_time: "20:45"

  # =============================================
  # === ГРУППА: НАЛОГОВЫЕ КАНАЛЫ ===
  # 8 каналов — объединённый дайджест 21:30 МСК
  # =============================================
  - chat: "@pronalog"
    purpose: "tax_channels_digest"
    mode: "daily_summary"
    summary_time: "21:30"
    track_engagement: true
    summary_prompt: >
      Ты — аналитик налоговых Telegram-каналов. Ниже — посты за день
      из нескольких налоговых каналов и чатов. У каждого поста указаны
      метрики вовлечённости: просмотры, реакции, репосты.

      Составь отчёт из ДВУХ частей:

      ЧАСТЬ 1: ДАЙДЖЕСТ НОВОСТЕЙ
      Сделай общую сборку по всем каналам:
      - Изменения законодательства
      - Новости судебной практики
      - Важные разъяснения ФНС/Минфина
      - Практические советы и кейсы
      - Международное налогообложение
      Группируй по темам, а не по каналам. Указывай источник (канал) и [MSG#N].
      Выдели самое важное для практикующего налогового консультанта.

      ЧАСТЬ 2: МАРКЕТИНГОВЫЙ АНАЛИЗ
      Для каждого канала/источника отдельно:
      - Какие посты набрали наибольшее количество реакций/лайков
        ОТНОСИТЕЛЬНО среднего для этого канала? (Сравнивай пост с другими
        постами того же канала, а НЕ с постами из других каналов.)
      - Почему эти посты «зашли»? Проанализируй:
        * Формат подачи (списки, сторителлинг, провокация, юмор, инфографика)
        * Тема (резонансная vs рутинная)
        * Приёмы вовлечения (вопросы, призывы, спорные утверждения)
        * Стиль заголовка
        * Длина поста
      - Какие выводы можно сделать для собственного контента?

      Формат: структурированный отчёт, кратко и по делу, на русском языке.

