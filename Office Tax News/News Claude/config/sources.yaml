  - id: intl_irs
    name: IRS — официальные налоговые новости
    lang: en
    weight: 3.5
    method: http
    parser: html_links
    window_hours: 168
    endpoints: ["https://www.irs.gov/newsroom/news-releases-for-current-month"]
    html:
      base: "https://www.irs.gov/"
      include: ["/newsroom/[a-z0-9-]{20,}/?$"]
      exclude: ["/news-releases-for-", "#"]
    require_topics_any: [dta, transfer_pricing, withholding_dividend, exchange_info, cross_border_trade_tax]

  - id: nl_douane
    name: Таможня Нидерландов — официальные новости
    lang: nl
    weight: 3.5
    method: http
    parser: html_links
    window_hours: 168
    endpoints: ["https://www.douane.nl/nieuws/nieuwsberichten/"]
    require_topics_any: [cross_border_trade_tax]
    html:
      base: "https://www.douane.nl/"
      include: ["douane\\.nl/[a-z0-9-]{15,}/?$"]
      exclude: ["/onderwerpen/", "/nieuws/", "/contact", "#"]

  - id: intl_oecd_tax
    name: ОЭСР — международное налогообложение
    lang: en
    weight: 3.5
    method: http
    parser: html_links
    window_hours: 168
    endpoints: ["https://www.oecd.org/en/topics/cross-border-and-international-tax.html"]
    require_topics_any: [dta, transfer_pricing, pillar2, exchange_info, withholding_dividend]
    html:
      base: "https://www.oecd.org/"
