# Источники v2 — только проверенные endpoints (проверка: 2026-07-02).
# method: chrome (ручной добор) | http (прямой HTTP-сбор)
# parser: rss | atom | auto | rechtspraak_atom | html_links
# collector: путь к скрипту прямого сбора (для method: http)
# prefiltered: true — сервер уже отфильтровал по теме, select_news пропускает
#   материал в шортлист и без матча ключевых слов (дефолтный приоритет).
# require_topics_any: хотя бы одна из перечисленных целевых тем обязательна;
#   широкие служебные теги (ru_tax_admin/nl_fiscaal) сами по себе не проходят.
#
# Квирки web_fetch, учтённые ниже (см. ENDPOINTS_REPORT.md за подробностями):
#  - application/xml (plain) и application/rss+xml рендерятся web_fetch как
#    [binary data] — реальный RSS/сырой XML нечитаем, поэтому RSS-выглядящие
#    источники (garant.ru, regfollower.com, taxlive.nl, taxence.nl) отдаются
#    через их HTML-страницы, а не через /feed или /rss.
#  - повторяющиеся query-параметры (date=A&date=B) молча схлопываются до
#    первого — для nl_rechtspraak окно нужно обходить по одному дню за вызов.
#  - subject=belastingrecht фильтр rechtspraak Open Data РАБОТАЕТ на сервере
#    при %23-кодировании '#' (проверено живьём 2026-07-17, §5.1 дорожной карты).
#    Прежний вывод «0 результатов» — артефакт web_fetch (терял фрагмент URL
#    после '#'). Сбор — прямым HTTP через scripts/collect_rechtspraak.py.
defaults:
  window_hours: 48

sources:
  - id: kz_kgd
    name: КГД Казахстана — официальные новости
    lang: ru
    weight: 3.5
    method: http
