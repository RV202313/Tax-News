# Каналы публикации, форматы, лимиты, язык и правила.
# Читается ПРОМТ 3 (черновики) и ПРОМТ 4 (публикация).
# По решению Роустама — весь контент на русском языке.

channels:
  - id: telegram_channel
    format: медиапост до 1024 знаков, заголовок, прямая ссылка на первоисточник, тематические хэштеги и обязательно #АкадемияBEPS #АкадемияБЕПС
    language: ru
    tone: экспертно, без канцелярита, вывод в конце

  - id: telegram_chats
    note: рассылка в чаты через мой антиспам-контакт; текст короче, 300–600 знаков, без ссылок-приманок
    language: ru
    tone: экспертно, коротко

  - id: vk
    format: как telegram_channel, но допускается 2–3 хэштега; процесс публикации уже налажен
    language: ru
    tone: экспертно, без канцелярита

  - id: linkedin
    format: пост 800–1800 знаков, хук в первой строке, 3–5 хэштегов
    language: ru
    tone: экспертно, профессионально

  - id: site
    format: лонгрид 800–1200 слов, H2-подзаголовки, цитаты из решения, вывод для практики
    language: ru
    tone: экспертно, аналитически

  - id: email
    format: блок дайджеста 3–5 предложений на материал; собирается еженедельно
    language: ru
    tone: экспертно, ёмко

rules:
  - Факты только из источника, ничего не додумывать; цифры и даты сверять.
  - Всегда прямая ссылка на первоисточник (ECLI, номер дела, URL), а не на главную страницу ведомства или пересказ.
  - Перед редакционным hand-off открыть каждую указанную ссылку: требуется HTTP 200, сохранённый final URL, дата проверки и дословная цитата из страницы для каждого ключевого тезиса.
  - Перед отправкой в Telegram движок повторно открывает ссылки и ищет сохранённые цитаты в содержимом страницы. Если ссылка не открывается, ведёт на другой материал, отдаёт нечитабельный формат или цитата не найдена — публикация блокируется.
  - Дисклеймер для судебных разборов — «не является налоговой консультацией».
  - Стиль — писать как практикующий налоговый юрист, а не как новостной агрегатор.
  - Если в источнике не хватает данных для утверждения — пометить [ПРОВЕРИТЬ].
