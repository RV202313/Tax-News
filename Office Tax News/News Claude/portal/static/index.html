<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новости Академии — редакционный портал</title><link rel="stylesheet" href="app.css"></head>
<body><header><div><p class="eyebrow">РЕДАКЦИОННЫЙ КОНТУР</p><h1>Новости Академии</h1></div><div id="health" class="health"></div></header>
<main><section class="toolbar"><label>Дата <select id="day"></select></label><button id="reload">Обновить</button><span id="summary"></span></section>
<section><h2>Покрытие источников</h2><div id="coverage" class="coverage"></div></section>
<section><h2>Матрица новостей</h2><p class="hint">Выберите направления, сохраните черновик и только затем отправляйте его. «Опубликовать» требует отдельного подтверждения.</p><div id="items"></div></section></main>
<template id="item-template"><article class="item"><div class="item-head"><span class="num"></span><div><a class="title" target="_blank" rel="noreferrer"></a><p class="meta"></p></div></div><div class="tags"></div><label class="channels"></label><label>Редакционная пометка <input class="note" placeholder="Например: акцент на риске для группы"></label><div class="buttons"><button class="save">Выбрать каналы</button><button class="skip secondary">Пропустить</button></div><details><summary>Черновики и отправка</summary><label>Канал <select class="draft-channel"><option value="telegram_channel">Telegram</option><option value="vk">VK</option><option value="linkedin">LinkedIn</option><option value="site">Сайт</option></select></label><textarea class="draft"></textarea><div class="buttons"><button class="save-draft secondary">Сохранить черновик</button><select class="publish-mode"><option value="draft">Создать черновик во внешнем сервисе</option><option value="schedule">Запланировать</option><option value="now">Опубликовать сейчас</option></select><button class="publish danger">Отправить</button></div><p class="delivery"></p></details></article></template>
<script src="app.js"></script></body></html>
